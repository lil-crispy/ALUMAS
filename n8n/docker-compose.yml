services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.34.6
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - TZ=America/Bogota
      - GENERIC_TIMEZONE=America/Bogota
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_n8n_data:/home/node/.n8n

volumes:
  n8n_n8n_data:
    external: true
